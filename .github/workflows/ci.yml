name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Lint / Typecheck / Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@9

      # Plain install, matching the Dockerfile — the committed lockfile is
      # known to lag, and --frozen-lockfile would fail CI on pre-existing drift.
      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test
