services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: property_crm
    # No host port published by default (avoids "address already in use").
    # The `web` service connects via DB_HOST=db on the compose network.
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d property_crm"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    env_file:
      - ./apps/web/.env.docker
    ports:
      # If port 3000 is already used on your host, change the left side
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    command: ["pnpm", "dev", "-H", "0.0.0.0", "-p", "3000"]

volumes:
  pg_data:
  web_node_modules:
  web_next_cache:
