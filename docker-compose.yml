services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: property_crm
    # Database port mapped to 2032 on host
    # The `web` service connects via DB_HOST=db on the compose network.
    ports:
      - "2032:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d property_crm"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: deps
    env_file:
      - ./apps/web/.env.docker
    ports:
      # Web service mapped to port 2001 on host
      - "2001:2000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    command: ["pnpm", "dev", "-H", "0.0.0.0", "-p", "2000"]

  web-prod:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runner
      args:
        CF_API_TOKEN: ${CF_API_TOKEN}
        CF_ACCOUNT_ID: ${CF_ACCOUNT_ID}
        JWT_SECRET: ${JWT_SECRET}
        JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    env_file:
      - ./apps/web/.env.docker
    ports:
      - "2001:2000"
    depends_on:
      db:
        condition: service_healthy
    # No volumes mount in prod; image is self-contained
    profiles:
      - prod

volumes:
  pg_data:
  web_node_modules:
  web_next_cache:
