server {
    listen 80;
    listen [::]:80;
    server_name aaqarplus.tech www.aaqarplus.tech;

    # Allow file uploads up to 50MB (dashboard allows 20MB; add headroom)
    client_max_body_size 50M;

    # Disable request/response buffering for large uploads
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:2001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (useful for Next.js dev/hmr if ever needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /uploads/ {
        # Served by the Next.js auth-gated route handler (app/uploads/[...path]) —
        # files live in data/uploads (outside public/) and require a session.
        proxy_pass http://127.0.0.1:2001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires off;
        add_header Cache-Control "private, no-store";
    }
}
